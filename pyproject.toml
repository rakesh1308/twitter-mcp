[project]
name = "twitter-mcp"
version = "2.0.0"
description = "Twitter/X API v2 MCP server - full API surface via OAuth 1.0a + OAuth 2.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "authlib>=1.3",
  "uvicorn>=0.30",
  "starlette>=0.38",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twitter_mcp = ["x_api_operations.json"]

[project.scripts]
twitter-mcp = "twitter_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]